version: 2
updates:
    - package-ecosystem: gomod
      directory: /
      schedule:
        interval: weekly
      labels:
        - ok-to-test
        - dependencies
        - release-note-none
        - kind/misc
      ignore:
        - dependency-name: k8s.io/*
          update-types:
            - version-update:semver-major
            - version-update:semver-minor
      groups:
        go-k8s-dependencies:
          patterns:
            - k8s.io/*
      cooldown:
        default-days: 7
        semver-major-days: 30
        semver-minor-days: 7
        semver-patch-days: 3
    - package-ecosystem: github-actions
      directory: /
      schedule:
        interval: weekly
      labels:
        - ok-to-test
        - dependencies
        - release-note-none
        - kind/misc
      groups:
        all:
          patterns:
            - '*'
      cooldown:
        default-days: 7
    - package-ecosystem: gomod
      directory: /
      target-branch: release-v0.9.x
      schedule:
        interval: weekly
      commit-message:
        prefix: '[release-v0.9.x] '
      labels:
        - ok-to-test
